<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Watershed Subbasins & Streamflow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <script src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        /* Make the popup wide enough for the chart */
        .maplibregl-popup-content {
            width: 450px !important;
            max-width: 90vw;
            padding: 15px;
        }
        
        /* Style for the chart container */
        #chart-container {
            width: 100%;
            height: 300px;
            background-color: #f9f9f9; /* Light grey background to show it exists */
        }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // 1. DATA BOUNDS
    var bounds = [
        [-124.5, 36.9], 
        [-121.3, 40.5]  
    ];

    var map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
        center: [-121.860352, 37.335216], 
        zoom: 8, 
        maxBounds: bounds
    });

    // HELPER: robustly get the root URL
    function getRootUrl() {
        var url = window.location.href;
        // Strip 'index.html' if present
        url = url.replace(/\/index\.html$/, '');
        // Strip trailing slash if present
        if (url.endsWith('/')) {
            url = url.slice(0, -1);
        }
        return url;
    }

    map.on('load', function () {
        var rootUrl = getRootUrl();
        console.log("Root URL detected as:", rootUrl);

        // --- SOURCE 1: SUBBASINS ---
        map.addSource('my-subbasins', {
            'type': 'vector',
            'tiles': [ rootUrl + '/output_tiles/{z}/{x}/{y}.pbf' ],
            'minzoom': 0, 'maxzoom': 12 
        });

        // --- SOURCE 2: STREAMS ---
        map.addSource('my-streams', {
            'type': 'vector',
            'tiles': [ rootUrl + '/topology_tiles/{z}/{x}/{y}.pbf' ],
            'minzoom': 0, 'maxzoom': 12 
        });

        // --- LAYER 1: Subbasin Fill ---
        map.addLayer({
            'id': 'subbasin-fill',
            'type': 'fill', 
            'source': 'my-subbasins',
            'source-layer': 'subbasins_wgs84', 
            'paint': {
                'fill-color': '#0080ff',
                'fill-opacity': 0.4,
                'fill-outline-color': '#ffffff'
            }
        });

        // --- LAYER 2: Subbasin Border ---
        map.addLayer({
            'id': 'subbasin-line',
            'type': 'line',
            'source': 'my-subbasins',
            'source-layer': 'subbasins_wgs84', 
            'paint': {
                'line-color': '#004080',
                'line-width': 1
            }
        });

        // --- LAYER 3: STREAMS ---
        map.addLayer({
            'id': 'stream-lines',
            'type': 'line',
            'source': 'my-streams',
            'source-layer': 'tu_domain_topology_wgs84', 
            'paint': {
                'line-color': '#00BFFF', 
                'line-width': 4, // Nice and thick for clicking
                'line-opacity': 0.9
            }
        });

        // ============================================
        // HOVER EFFECTS (FIXED)
        // ============================================
        
        // Subbasins
        map.on('mouseenter', 'subbasin-fill', () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', 'subbasin-fill', () => map.getCanvas().style.cursor = '');

        // Streams
        map.on('mouseenter', 'stream-lines', () => map.getCanvas().style.cursor = 'pointer');
        
        // BUG FIX: Added 'e' parameter to this function
        map.on('mouseleave', 'stream-lines', (e) => {
             // Check if we are still over a subbasin (don't flicker if moving from stream to basin)
             // BUG FIX: Used 'e.point' instead of 'event.point'
             var features = map.queryRenderedFeatures(e.point, { layers: ['subbasin-fill'] });
             map.getCanvas().style.cursor = features.length ? 'pointer' : '';
        });

        // ============================================
        // CLICK 1: SUBBASINS
        // ============================================
        map.on('click', 'subbasin-fill', function (e) {
            // Priority Check: If we clicked a stream, stop here.
            var streamFeatures = map.queryRenderedFeatures(e.point, { layers: ['stream-lines'] });
            if (streamFeatures.length > 0) return; 

            var props = e.features[0].properties;
            var content = '<h3>Subbasin Info</h3>' +
                          '<p><strong>REW:</strong> ' + (props.REW || 'N/A') + '</p>' +
                          '<p><strong>FID:</strong> ' + (props.FID || 'N/A') + '</p>';

            new maplibregl.Popup()
                .setLngLat(e.lngLat)
                .setHTML(content)
                .addTo(map);
        });

        // ============================================
        // CLICK 2: STREAMS + CHART (DEBUGGED)
        // ============================================
        map.on('click', 'stream-lines', function (e) {
            e.preventDefault(); 
            
            var coordinates = e.lngLat;
            var props = e.features[0].properties;
            var rewName = props.REW; 

            console.log("--- STREAM CLICK DEBUG ---");
            console.log("1. Clicked REW Name:", rewName); 

            if (!rewName) {
                console.error("ERROR: REW is undefined. Check Tippecanoe generation.");
                alert("Error: No REW name found on this line.");
                return;
            }

            // Construct CSV Path
            var rootUrl = getRootUrl();
            var csvUrl = rootUrl + '/flow_csvs/' + rewName + '.csv';
            
            console.log("2. Fetching CSV from:", csvUrl);

            // Create Popup
            var popupContent = `
                <div style="font-family: sans-serif;">
                    <h3 style="margin: 0 0 5px 0;">${rewName} Streamflow</h3>
                    <a href="${csvUrl}" download style="display:block; margin-bottom:10px; font-size:12px; color:#007bff;">
                        &#11015; Download Data
                    </a>
                    <div id="chart-container">Loading Chart...</div>
                </div>
            `;

            new maplibregl.Popup()
                .setLngLat(coordinates)
                .setHTML(popupContent)
                .addTo(map);

            // Fetch CSV
            Papa.parse(csvUrl, {
                download: true,
                header: true, 
                skipEmptyLines: true,
                dynamicTyping: true, 
                complete: function(results) {
                    console.log("3. CSV Download Complete. Rows:", results.data.length);

                    var data = results.data;
                    if (!data || data.length === 0) {
                        document.getElementById('chart-container').innerHTML = "No data found in CSV.";
                        return;
                    }

                    // Auto-detect keys (Col 1 = Date, Col 2 = Flow)
                    var keys = Object.keys(data[0]);
                    var dateKey = keys[0];
                    var flowKey = keys[1];
                    console.log("4. Using Columns:", dateKey, flowKey);

                    var xDates = data.map(r => r[dateKey]);
                    var yFlows = data.map(r => r[flowKey]);

                    var trace1 = {
                        x: xDates,
                        y: yFlows,
                        mode: 'lines',
                        type: 'scatter',
                        line: { color: '#17BECF' }
                    };

                    var layout = {
                        margin: { t: 10, r: 10, b: 30, l: 40 },
                        xaxis: { title: 'Date' },
                        yaxis: { title: 'Flow' },
                        responsive: true
                    };
                    
                    try {
                        Plotly.newPlot('chart-container', [trace1], layout);
                        console.log("5. Chart Rendered Successfully");
                    } catch (err) {
                        console.error("PLOTLY ERROR:", err);
                        document.getElementById('chart-container').innerHTML = "Chart Error: " + err.message;
                    }
                },
                error: function(err) {
                    console.error("CSV LOAD ERROR:", err);
                    document.getElementById('chart-container').innerHTML = 
                        "<p style='color:red;'>Could not load CSV.<br>Checked path: " + csvUrl + "</p>";
                }
            });
        });
    });
</script>

</body>
</html>
