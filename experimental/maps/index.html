<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Watershed Subbasins</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // 1. DATA BOUNDS from your metadata.json
    // [West, South, East, North]
    // We add a tiny bit of padding so the user doesn't feel "claustrophobic"
    // but strictly speaking, these are your data edges.
    var bounds = [
        [-124.5, 36.9], // Southwest coordinate (approx)
        [-121.3, 40.5]  // Northeast coordinate (approx)
    ];

    var map = new maplibregl.Map({
        container: 'map',
        // Free basemap (Carto Voyager)
        style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
        
        // Center from metadata.json: "-121.860352,37.335216"
        center: [-121.860352, 37.335216], 
        
        // Start at a zoom level where we can see the whole dataset
        zoom: 8, 
        
        // CRITICAL: This locks the user into the area where you actually have tiles.
        // It prevents panning into empty white space where files are missing.
        maxBounds: bounds
    });

    map.on('load', function () {
        
        // 2. Add Source
        map.addSource('my-subbasins', {
            'type': 'vector',
            'tiles': [
                // Builds the URL dynamically based on where this file is hosted
                window.location.href.replace('/index.html', '') + '/output_tiles/{z}/{x}/{y}.pbf'
            ],
            // EXACT MATCH from metadata.json
            'minzoom': 0,
            'maxzoom': 12 
        });

        // 3. Add Fill Layer
        map.addLayer({
            'id': 'subbasin-fill',
            'type': 'fill', 
            'source': 'my-subbasins',
            // EXACT MATCH from metadata.json json: "vector_layers": [ { "id": "subbasins_wgs84" ...
            'source-layer': 'subbasins_wgs84', 
            'paint': {
                'fill-color': '#0080ff',
                'fill-opacity': 0.4,
                'fill-outline-color': '#ffffff'
            }
        });

        // 4. Add Line Layer (Border)
        map.addLayer({
            'id': 'subbasin-line',
            'type': 'line',
            'source': 'my-subbasins',
            'source-layer': 'subbasins_wgs84',
            'paint': {
                'line-color': '#004080',
                'line-width': 1
            }
        });
    });
</script>

</body>
</html>
