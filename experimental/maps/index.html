<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Watershed Subbasins & Streamflow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <script src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        /* Make the popup wide enough for the chart */
        .maplibregl-popup-content {
            width: 450px !important;
            max-width: 90vw;
            padding: 15px;
        }
        
        /* Style for the chart container */
        #chart-container {
            width: 100%;
            height: 300px;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // 1. DATA BOUNDS
    var bounds = [
        [-124.5, 36.9], 
        [-121.3, 40.5]  
    ];

    var map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
        center: [-121.860352, 37.335216], 
        zoom: 8, 
        maxBounds: bounds
    });

    map.on('load', function () {
        
        // --- SOURCE 1: SUBBASINS ---
        map.addSource('my-subbasins', {
            'type': 'vector',
            'tiles': [ window.location.href.replace('/index.html', '') + '/output_tiles/{z}/{x}/{y}.pbf' ],
            'minzoom': 0, 'maxzoom': 12 
        });

        // --- SOURCE 2: STREAMS ---
        map.addSource('my-streams', {
            'type': 'vector',
            'tiles': [ window.location.href.replace('/index.html', '') + '/topology_tiles/{z}/{x}/{y}.pbf' ],
            'minzoom': 0, 'maxzoom': 12 
        });

        // --- LAYER 1: Subbasin Fill ---
        map.addLayer({
            'id': 'subbasin-fill',
            'type': 'fill', 
            'source': 'my-subbasins',
            'source-layer': 'subbasins_wgs84', 
            'paint': {
                'fill-color': '#0080ff',
                'fill-opacity': 0.4,
                'fill-outline-color': '#ffffff'
            }
        });

        // --- LAYER 2: Subbasin Border ---
        map.addLayer({
            'id': 'subbasin-line',
            'type': 'line',
            'source': 'my-subbasins',
            'source-layer': 'subbasins_wgs84',
            'paint': {
                'line-color': '#004080',
                'line-width': 1
            }
        });

        // --- LAYER 3: STREAMS ---
        map.addLayer({
            'id': 'stream-lines',
            'type': 'line',
            'source': 'my-streams',
            'source-layer': 'tu_domain_topology_wgs84', 
            'paint': {
                'line-color': '#00BFFF', 
                'line-width': 3, 
                'line-opacity': 0.9
            }
        });

        // ============================================
        // INTERACTIVITY 1: SUBBASINS (Click)
        // ============================================
        map.on('click', 'subbasin-fill', function (e) {
            var props = e.features[0].properties;
            var content = '<h3>Subbasin Info</h3>' +
                          '<p><strong>REW:</strong> ' + (props.REW || 'N/A') + '</p>' +
                          '<p><strong>FID:</strong> ' + (props.FID || 'N/A') + '</p>';

            new maplibregl.Popup()
                .setLngLat(e.lngLat)
                .setHTML(content)
                .addTo(map);
        });

        // ============================================
        // INTERACTIVITY 2: STREAMS + CHART + DOWNLOAD
        // ============================================
        map.on('click', 'stream-lines', function (e) {
            e.preventDefault(); 
            
            var coordinates = e.lngLat;
            var props = e.features[0].properties;
            var rewName = props.REW; 

            // 1. Construct CSV Path immediately
            // We use this for both the download link and the chart data fetch
            var csvUrl = window.location.href.replace('/index.html', '') + '/flow_csvs/' + rewName + '.csv';

            // 2. Create the Popup HTML (With Download Link)
            // 'download' attribute forces browser to download file instead of navigating to it
            var popupContent = `
                <div style="font-family: sans-serif;">
                    <h3 style="margin: 0 0 5px 0;">${rewName} Streamflow</h3>
                    
                    <a href="${csvUrl}" download style="display:block; margin-bottom:15px; font-size:12px; color:#007bff; text-decoration:none;">
                        &#11015; Download Raw Data (.csv)
                    </a>

                    <div id="chart-container">Loading data...</div>
                </div>
            `;

            // 3. Open the popup
            new maplibregl.Popup()
                .setLngLat(coordinates)
                .setHTML(popupContent)
                .addTo(map);

            // 4. Fetch and Parse CSV for the Chart
            Papa.parse(csvUrl, {
                download: true,
                header: true, 
                skipEmptyLines: true,
                dynamicTyping: true, 
                complete: function(results) {
                    var data = results.data;

                    if (!data || data.length === 0) {
                        document.getElementById('chart-container').innerHTML = "No data found in CSV.";
                        return;
                    }

                    // Prepare Data for Plotly
                    var xDates = [];
                    var yFlows = [];
                    
                    var keys = Object.keys(data[0]); // Auto-detect column headers
                    var dateKey = keys[0];
                    var flowKey = keys[1];

                    data.forEach(function(row) {
                        xDates.push(row[dateKey]);
                        yFlows.push(row[flowKey]);
                    });

                    // Draw the Plot
                    var trace1 = {
                        x: xDates,
                        y: yFlows,
                        mode: 'lines',
                        type: 'scatter',
                        line: { color: '#17BECF' },
                        name: 'Streamflow'
                    };

                    var layout = {
                        margin: { t: 10, r: 10, b: 40, l: 50 }, 
                        xaxis: { title: 'Date' },
                        yaxis: { title: 'Flow (mm/day)' },
                        dragmode: 'zoom',
                        hovermode: 'closest'
                    };

                    var config = {
                        responsive: true,
                        displayModeBar: true,
                        modeBarButtonsToRemove: ['toImage', 'sendDataToCloud']
                    };

                    Plotly.newPlot('chart-container', [trace1], layout, config);
                },
                error: function(err) {
                    document.getElementById('chart-container').innerHTML = 
                        "<p style='color:red;'>Could not load chart data.<br>Missing file: " + rewName + ".csv</p>";
                }
            });
        });

        // Hover cursors
        map.on('mouseenter', 'subbasin-fill', () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', 'subbasin-fill', () => map.getCanvas().style.cursor = '');
        map.on('mouseenter', 'stream-lines', () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', 'stream-lines', () => {
             var features = map.queryRenderedFeatures(event.point, { layers: ['subbasin-fill'] });
             map.getCanvas().style.cursor = features.length ? 'pointer' : '';
        });
    });
</script>

</body>
</html>
