<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Watershed Subbasins</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    var map = new maplibregl.Map({
        container: 'map',
        // Free basemap (Carto Voyager is clean and nice)
        style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
        center: [-120.5, 37.5], // Approximate Center of California
        zoom: 6
    });

    map.on('load', function () {
        
        // 1. Add Source
        map.addSource('my-subbasins', {
            'type': 'vector',
            'tiles': [
                // RELATIVE PATH: This looks for the folder next to index.html
                window.location.href.replace('/index.html', '') + '/output_tiles/{z}/{x}/{y}.pbf'
            ],
            'minzoom': 5,
            'maxzoom': 12 
        });

        // 2. Add Layer
        map.addLayer({
            'id': 'subbasin-fill',
            'type': 'fill', 
            'source': 'my-subbasins',
            // MUST MATCH the name from your Tippecanoe output
            'source-layer': 'subbasins_wgs84', 
            'paint': {
                'fill-color': '#0080ff',
                'fill-opacity': 0.4,
                'fill-outline-color': '#ffffff'
            }
        });

        // 3. Optional: Add a line layer on top to make borders pop
        map.addLayer({
            'id': 'subbasin-line',
            'type': 'line',
            'source': 'my-subbasins',
            'source-layer': 'subbasins_wgs84',
            'paint': {
                'line-color': '#004080',
                'line-width': 1
            }
        });
    });
</script>

</body>
</html>
